<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>iPod</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="navbar" id="navbar">
      <button class="nb-back" id="navBack" hidden><span></span></button>
      <h1 id="navTitle">iPod</h1>
      <button class="nb-now" id="navNow" hidden><span>Ahora suena</span></button>
    </header>
    <main class="views" id="views"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <section class="now" id="now" aria-hidden="true">
    <header class="np-top">
      <button class="np-back" id="npBack" aria-label="Volver"></button>
      <div class="np-info">
        <div class="np-artist" id="npArtist"></div>
        <div class="np-title" id="npTitle"></div>
        <div class="np-album" id="npAlbum"></div>
      </div>
      <button class="np-flip" id="npFlip" aria-label="Lista de reproducción"></button>
    </header>

    <div class="np-stage" id="npStage">
      <div class="np-art" id="npArt"></div>
      <div class="np-scrub" id="npScrub" hidden>
        <button class="np-rep" id="npRepeat" aria-label="Repetir"></button>
        <div class="np-time">
          <span id="npCur">0:00</span>
          <input type="range" class="slider" id="npSeek" min="0" max="1000" value="0" aria-label="Posición">
          <span id="npLeft">-0:00</span>
        </div>
        <button class="np-shuf" id="npShuffle" aria-label="Aleatorio"></button>
      </div>
    </div>

    <div class="np-queue" id="npQueue"></div>

    <footer class="np-ctrl">
      <div class="np-btns">
        <button id="npPrev" aria-label="Anterior"></button>
        <button id="npPlay" aria-label="Reproducir"></button>
        <button id="npNext" aria-label="Siguiente"></button>
      </div>
      <div class="np-vol">
        <i class="spk0"></i>
        <input type="range" class="slider" id="npVol" min="0" max="100" value="100" aria-label="Volumen">
        <i class="spk1"></i>
      </div>
    </footer>
  </section>

  <div class="layer" id="layer"></div>
  <input type="file" id="filePick" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav" multiple hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
