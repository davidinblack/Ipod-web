# Compila la app Android (Trusted Web Activity) y la publica como Release.
# El APK abre https://davidinblack.github.io/Ipod-web/ a pantalla completa con Chrome,
# así que las actualizaciones de la app web llegan solas; sólo hay que recompilar si
# cambia algo de android/ (nombre, ícono, versión del contenedor).
#
# Necesita dos secretos del repositorio (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE           la llave de firma en base64
#   ANDROID_KEYSTORE_PASSWORD  su contraseña
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Revisar la llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then echo "HAS_KEY=true" >> "$GITHUB_ENV"; exit 0; fi
          echo "::warning::Faltan los secretos ANDROID_KEYSTORE y ANDROID_KEYSTORE_PASSWORD (ver README › App Android). No se compila."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi

      - uses: actions/setup-java@v5
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: '20'

      - name: Generar el proyecto Android
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('../web/version.json'))['version'])")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          VERSION_NAME=$VERSION_NAME VERSION_CODE=${{ github.run_number }} node generate.mjs build

      - name: Compilar
        if: env.HAS_KEY == 'true'
        working-directory: android/build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firmar
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          # tolera espacios / saltos de línea al pegar los secretos
          PASS=$(printf %s "$KS_PASS" | tr -d '\r\n')
          if ! printf %s "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/ipod.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE no es base64 válido: pega todo el contenido de keystore-base64.txt"; exit 1
          fi
          echo "::notice::Llave decodificada: $(stat -c %s "$RUNNER_TEMP/ipod.keystore") bytes"
          if ! keytool -list -keystore "$RUNNER_TEMP/ipod.keystore" -storepass "$PASS" -alias ipod >/dev/null 2>"$RUNNER_TEMP/kt.err"; then
            echo "::error::La llave no abre con ANDROID_KEYSTORE_PASSWORD (o falta el alias ipod): $(head -c 300 "$RUNNER_TEMP/kt.err" | tr '\n' ' ')"; exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "::notice::build-tools: $BT"
          APK=$(find android/build/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::No se encontró el APK compilado"; find android/build/app/build/outputs || true; exit 1; fi
          echo "::notice::APK compilado: $APK"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk" || { echo "::error::zipalign falló"; exit 1; }
          if ! "$BT/apksigner" sign --ks "$RUNNER_TEMP/ipod.keystore" --ks-key-alias ipod \
               --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out ipod.apk "$RUNNER_TEMP/aligned.apk" 2>"$RUNNER_TEMP/sign.err"; then
            echo "::error::apksigner falló: $(head -c 400 "$RUNNER_TEMP/sign.err" | tr '\n' ' ')"; exit 1
          fi
          FP=$("$BT/apksigner" verify --print-certs ipod.apk | grep -i "SHA-256" | head -1 | sed 's/.*: //')
          echo "::notice::Firmado. Huella SHA-256: $FP"
          rm -f "$RUNNER_TEMP/ipod.keystore"

      - name: Publicar
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: App Android ${{ env.VERSION_NAME }} (${{ github.run_number }})
          make_latest: true
          files: ipod.apk
          body: |
            Descarga **ipod.apk** en el teléfono y ábrelo para instalar.
            Si Android lo pide, permite «Instalar apps desconocidas» para Chrome o tu gestor de archivos.

            Enlace fijo a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/ipod.apk
