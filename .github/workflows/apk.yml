# Compila la app Android (Trusted Web Activity) y la publica como Release.
# El APK abre https://davidinblack.github.io/Ipod-web/ a pantalla completa con Chrome,
# así que las actualizaciones de la app web llegan solas; sólo hay que recompilar si
# cambia algo de android/ (nombre, ícono, versión del contenedor).
#
# Necesita dos secretos del repositorio (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE           la llave de firma en base64
#   ANDROID_KEYSTORE_PASSWORD  su contraseña
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then echo "HAS_KEY=true" >> "$GITHUB_ENV"; exit 0; fi
          echo "::warning::Faltan los secretos ANDROID_KEYSTORE y ANDROID_KEYSTORE_PASSWORD (ver README › App Android). No se compila."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi

      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: '20'

      - name: Generar el proyecto Android
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          VERSION_NAME=$(python3 -c "import json;print(json.load(open('../web/version.json'))['version'])")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          VERSION_NAME=$VERSION_NAME VERSION_CODE=${{ github.run_number }} node generate.mjs build

      - name: Compilar
        if: env.HAS_KEY == 'true'
        working-directory: android/build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Firmar
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ipod.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/build/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ipod.keystore" --ks-key-alias ipod \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ipod.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ipod.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/ipod.keystore"

      - name: Publicar
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: App Android ${{ env.VERSION_NAME }} (${{ github.run_number }})
          make_latest: true
          files: ipod.apk
          body: |
            Descarga **ipod.apk** en el teléfono y ábrelo para instalar.
            Si Android lo pide, permite «Instalar apps desconocidas» para Chrome o tu gestor de archivos.

            Enlace fijo a la última versión:
            https://github.com/${{ github.repository }}/releases/latest/download/ipod.apk
