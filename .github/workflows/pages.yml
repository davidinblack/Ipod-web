# Publica la carpeta web/ en GitHub Pages cada vez que cambia en main.
# La versión se sella con la fecha y el commit, así la app avisa "Actualizar app" sola.
name: Publicar app

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sellar versión
        run: |
          echo "{ \"version\": \"$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}\" }" > web/version.json
          cat web/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
